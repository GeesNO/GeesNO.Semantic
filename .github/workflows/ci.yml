name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-conformance.txt
      - name: Install reference conformance dependencies
        run: python -m pip install -r requirements-conformance.txt
      - name: Structure, links, formatting and syntax
        run: python tools/validation/check_repository.py
      - name: Integrated offline conformance suite
        run: python tools/validation/reference_cli.py validate-repository
      - name: S2 Layers 0-3 conformance suite
        run: python conformance/runner/run.py
      - name: Unit and schema self-tests
        run: python -m unittest discover -s tools/validation/tests -v
      - name: Compile reference Python tooling
        run: python -m compileall -q conformance tools
